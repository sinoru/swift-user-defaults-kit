# Builds the package for every Apple platform it declares support for, through the Xcode build
# system, and runs its tests wherever a runner can boot the destination.
#
# A different axis from ci.yml rather than a duplicate of it, and the reason is plain: `swift build`
# compiles for the host and nothing else, so the only Apple platform anyone ever compiled was macOS.
# `Package.swift` claims five more. A claim that is never compiled is a guess, and this is what turns
# it into a fact — including the two targets that exist only on Apple platforms, `UserDefaultsKit`'s
# Combine and SwiftUI halves, whose availability rules are not the same on every one.
#
# The watchOS *device* row is the only place `Int` is 32 bits, which is the width
# `PropertyListValue.propertyList` narrows against. Nothing can be run there — no runner has a watch
# attached — so this compiles that configuration and stops, which is still more than nothing was
# doing before.
#
# What this deliberately does not do is pin old OS runtimes the way the sibling package does. That
# one branches on OS version at run time and back-deploys metadata, so supporting a release is a
# claim only that release can settle. Nothing here has an `#available` in it, and its one
# `@available` is on a test rather than on shipped behaviour: what this package does is the same on
# every version of a platform, so a second version of one would repeat a multi-gigabyte download to
# say nothing.

name: Apple Platforms

# Pushes only fire on the branches git-flow keeps around: the two long-lived ones plus the
# release-prep pair. Short-lived feature branches are covered by the pull_request trigger when they
# open against one of these, so listing them here would only run this matrix twice for the same
# commit.
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop, "release/**", "hotfix/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform.name }} · ${{ matrix.configuration }}
    runs-on: macos-26
    # Nothing here should take minutes, and the alternative backstop is GitHub's 360-minute default.
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: ${{ matrix.xcode.developer_dir }}
    strategy:
      fail-fast: false
      # Device and simulator are separate SDKs and separate target triples, so they fail
      # independently — and on watchOS they take opposite sides of the pointer width above.
      #
      # A row that can run its tests says how to name a destination xcodebuild can launch:
      # test_destination where the platform names itself, simulator_runtime where a device has to be
      # looked up. The device rows carry neither and stop after the build, since nothing is attached
      # to a runner to run their binaries on.
      #
      # Crossed with the configuration axis for the reason ci.yml states at length: debug and
      # release are not the same program, and only one of them is what ships. Here the crossing buys
      # something that axis cannot buy on the host — the watchOS device row's 32-bit narrowing is
      # compiled nowhere else, and an optimizer is entitled to break a narrowing that a debug build
      # gets right. Nothing else in the matrix distinguishes the two, so the pair simply doubles.
      matrix:
        xcode:
          - name: "Swift 6.3.3"
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
        configuration: [Debug, Release]
        platform:
          # Both name their variant. `generic/platform=macOS` alone matches the Catalyst
          # destination as well, and xcodebuild answers that by taking "the first of multiple
          # matching destinations" in an order it does not publish — so the row whose whole purpose
          # is to be the *other* axis could silently become this one, and stay green while doing it.
          # The test destination needs an architecture on top to come out unambiguous.
          - name: "macOS"
            destination: "generic/platform=macOS,variant=macos"
            test_destination: "platform=macOS,arch=arm64,variant=macos"
          - name: "Mac Catalyst"
            destination: "generic/platform=macOS,variant=Mac Catalyst"
            test_destination: "platform=macOS,arch=arm64,variant=Mac Catalyst"
          - name: "iOS"
            destination: "generic/platform=iOS"
          - name: "iOS Simulator"
            destination: "generic/platform=iOS Simulator"
            simulator_runtime: iOS
          - name: "tvOS"
            destination: "generic/platform=tvOS"
          - name: "tvOS Simulator"
            destination: "generic/platform=tvOS Simulator"
            simulator_runtime: tvOS
          - name: "watchOS"
            destination: "generic/platform=watchOS"
          - name: "watchOS Simulator"
            destination: "generic/platform=watchOS Simulator"
            simulator_runtime: watchOS
          - name: "visionOS"
            destination: "generic/platform=visionOS"
          # visionOS answers to xrOS in CoreSimulator's runtime identifiers, which is the spelling
          # the lookup below matches against.
          - name: "visionOS Simulator"
            destination: "generic/platform=visionOS Simulator"
            simulator_runtime: xrOS
    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -version

      # build-for-testing rather than build: it compiles the test targets as well, which is where
      # the availability annotations and the 32-bit narrowing are actually exercised, and a generic
      # destination covers every architecture its SDK supports where the concrete one the run below
      # needs does not.
      #
      # Both steps name the same derived data, so the run reuses what this built.
      #
      # The configuration is stated rather than left to the scheme. Nothing here commits a scheme,
      # so `-scheme UserDefaultsKit` resolves to the one SwiftPM generates, whose build and test
      # actions default to Debug — which meant every row was a debug row and the file said so
      # nowhere.
      #
      # Testability has to be asked for because the test targets import their modules `@testable`.
      # In Debug it is already on; in Release it is not, and it is what makes the two rows differ by
      # the optimizer alone rather than by what the test targets can see. The default traits are
      # left on: a consumer opting out is a different configuration, and ci.yml is where that one is
      # compiled.
      - name: xcodebuild build-for-testing
        run: |
          xcodebuild build-for-testing \
            -scheme UserDefaultsKit \
            -destination '${{ matrix.platform.destination }}' \
            -configuration ${{ matrix.configuration }} \
            SWIFT_ENABLE_TESTABILITY=YES \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"

      # Tests need a destination xcodebuild can launch, which rules out the generic ones above.
      # macOS and Mac Catalyst name themselves; a simulator row states its runtime and this picks a
      # device out of the copy that this Xcode ships, because the runner image's device list turns
      # over with every release and a hardcoded name would rot. jq fails the step rather than
      # resolving to a null id if the runtime is missing.
      #
      # A row that can run nothing leaves the variable empty, and the step after this drops out.
      - name: Resolve the test destination
        run: |
          if [ -n "${{ matrix.platform.simulator_runtime }}" ]; then
            udid=$(xcrun simctl list devices available --json | jq -er \
              --arg prefix "com.apple.CoreSimulator.SimRuntime.${{ matrix.platform.simulator_runtime }}" \
              '[.devices | to_entries[] | select(.key | startswith($prefix)) | .value[]][0].udid')
            echo "TEST_DESTINATION=id=$udid" >> "$GITHUB_ENV"
          else
            echo "TEST_DESTINATION=${{ matrix.platform.test_destination }}" >> "$GITHUB_ENV"
          fi

      # The measurement suites are skipped for the reason ci.yml skips them: a release row would
      # otherwise execute `measure` blocks that no baseline can fail and nobody reads, on a
      # simulator, where `XCTCPUMetric` wants hardware performance counters it may not have. Stated
      # unconditionally rather than only on the release rows — in debug they already skip
      # themselves, so naming them twice would be the same instruction written in two places.
      - name: xcodebuild test-without-building
        if: env.TEST_DESTINATION
        run: |
          xcodebuild test-without-building \
            -scheme UserDefaultsKit \
            -destination "$TEST_DESTINATION" \
            -configuration ${{ matrix.configuration }} \
            -skip-testing:UserDefaultsKitCoreTests/UserDefaultsPerformanceTests \
            -skip-testing:UserDefaultsKitPropertyListTests/PropertyListCoderPerformanceTests \
            -derivedDataPath "$RUNNER_TEMP/DerivedData"
