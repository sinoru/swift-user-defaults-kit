# Builds the package through SwiftPM across the Swift toolchains it claims to support, on every
# target the runners can reach, and checks that every trait set a consumer can ask for still
# compiles. The toolchain setup, the matrix and the build steps live in sinoru/github-workflows;
# what is here is what is particular to this package. The Xcode build system takes a different
# path through the same manifest, so Apple platform coverage lives in apple-platforms.yml.

name: Swift

# Pushes only fire on the branches git-flow keeps around: the two long-lived ones plus the
# release-prep pair. Short-lived feature branches are covered by the pull_request trigger when
# they open against develop, so listing them here would only run the same commit twice.
#
# And only for a change that can alter what is built here: the sources, the tests, the manifest
# and what it resolved to, and this file. A commit to the README or the changelog runs nothing.
# A branch filter and a path filter must both be satisfied.
on:
  push:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths: &paths
      - Sources/**
      - Tests/**
      - Package.swift
      - Package.resolved
      - .github/workflows/swift.yml
  pull_request:
    branches: [main, develop, "release/**", "hotfix/**"]
    paths: *paths

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Two minors, every target, both configurations. 6.3 is the floor the manifest declares and
  # 6.4 the newest; nothing in the sources tells them apart, so the second is there for a
  # toolchain change that breaks the package to show as a red job. Release is the library as a
  # client gets it, and the only configuration where cross-module optimization applies, which
  # every read and write does on its way into swift-property-list's coder; it is tested as
  # shipped, nothing here being `@testable`. Debug is where `assertionFailure` exists, so the
  # setter's encode-failure path is reachable only there.
  #
  # The shipping build names the umbrella. A bare build would also compile the test support
  # target, which imports Testing and so cannot build on the static Linux SDK, where no testing
  # library exists.
  #
  # Swift Testing alone: the one XCTest suite, the performance measurements, is Darwin-only and
  # skipped there by apple-platforms.yml, so `--disable-xctest` leaves nothing out here and
  # keeps the corelibs runner from trapping on an empty list.
  #
  # The targets, and why each is here. swift-corelibs-foundation has no KVO and posts
  # `didChangeNotification` only for whole-domain changes, so `UserDefaults.Observation` and
  # `UserDefault.values` compile out away from Darwin; the non-Darwin rows guard that boundary
  # and the storage half.
  #
  # - Linux, and Linux arm64 for the other server architecture. The suites run one at a time
  #   there: corelibs Foundation reads the user name through `getpwuid()`, out of a buffer every
  #   thread shares, so two tests using `UserDefaults` at once can garble each other's lookup
  #   and lose a write now and then (swiftlang/swift-corelibs-foundation#5581). Windows reads
  #   the name another way. The README says a plain `swift test` on Linux can still fail so.
  # - Windows is the other non-Darwin Foundation, built from the same corelibs over a different
  #   C library.
  # - Linux musl cross-compiles through the static SDK and builds only: the SDK ships no testing
  #   library.
  # - WebAssembly wasip1 builds only, for now. Foundation's static archive leaves out `Array`'s
  #   bridging conformance, so `set(_:forKey:)` with an array value traps in
  #   `CFPreferencesSetAppValue`, and a trap takes the whole test run with it. The day
  #   swift-corelibs-foundation#5580 is fixed, the row runs its tests through WasmKit.
  # - Android API 28 is the one Foundation here built against bionic, and runs its tests on the
  #   emulator, serialized as Linux is: whether bionic shares the buffer is unchecked, but
  #   Foundation takes the same path and serializing costs little. The arm64 row is built only;
  #   nothing hosted can run it.
  # - ThreadSanitizer, on macOS and Linux: the change publisher gives a `CurrentValueSubject` a
  #   `nonisolated(unsafe)` opt-out, Combine does not document `send(_:)` as callable from any
  #   thread, and KVO delivers on the writing thread.
  # - AddressSanitizer, on the same two: a use-after-free has happened before, in the handler
  #   snapshot an observation takes out of its lock before calling out. The two sanitizers cannot
  #   share a build.
  swift:
    uses: sinoru/github-workflows/.github/workflows/swift.yml@main
    with:
      swift: '["6.3", "6.4"]'
      configurations: '["Debug", "Release"]'
      target: UserDefaultsKit
      test-arguments: --disable-xctest
      targets: |
        [
          "arm64-apple-macosx",
          { "triple": "x86_64-unknown-linux-gnu", "test_run_arguments": "--no-parallel" },
          { "triple": "aarch64-unknown-linux-gnu", "test_run_arguments": "--no-parallel" },
          "x86_64-unknown-windows-msvc",
          "aarch64-unknown-windows-msvc",
          "x86_64-swift-linux-musl",
          { "triple": "wasm32-unknown-wasip1", "skip_tests": true },
          { "triple": "x86_64-unknown-linux-android28", "test_run_arguments": "--no-parallel" },
          "aarch64-unknown-linux-android28",
          { "triple": "arm64-apple-macosx", "sanitize": "thread" },
          { "triple": "arm64-apple-macosx", "sanitize": "address" },
          { "triple": "x86_64-unknown-linux-gnu", "sanitize": "thread", "test_run_arguments": "--no-parallel" },
          { "triple": "x86_64-unknown-linux-gnu", "sanitize": "address", "test_run_arguments": "--no-parallel" }
        ]

  # The trait set is part of the package's public interface, so every configuration a consumer
  # can ask for has to keep compiling: each half on its own, and neither, which leaves the
  # umbrella with nothing but the core. `--target` is what makes any of these mean anything: a
  # trait decides what `UserDefaultsKit` depends on, not what the package contains, and a bare
  # `swift build` compiles every target regardless, so the umbrella's `canImport` would find a
  # stray module and the check would stay green. The default set, both halves, is what the rows
  # above build and test.
  builds:
    uses: sinoru/github-workflows/.github/workflows/builds.yml@main
    with:
      swift: '["6.3", "6.4"]'
      targets: |
        [
          "arm64-apple-macosx",
          "x86_64-unknown-linux-gnu",
          "aarch64-unknown-linux-gnu",
          "x86_64-unknown-windows-msvc",
          "aarch64-unknown-windows-msvc",
          "x86_64-swift-linux-musl",
          "wasm32-unknown-wasip1",
          "x86_64-unknown-linux-android28",
          "aarch64-unknown-linux-android28"
        ]
      builds: |
        [
          "--target UserDefaultsKit --traits Combine",
          "--target UserDefaultsKit --traits SwiftUI",
          "--target UserDefaultsKit --disable-default-traits"
        ]
