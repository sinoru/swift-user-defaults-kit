name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
      # The trait set is part of the package's public interface, so the configuration a consumer
      # gets by opting out has to keep compiling.
      - name: Build without default traits
        run: swift build --disable-default-traits

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.3
    # Reading and writing works here; observing does not. swift-corelibs-foundation has no KVO, and
    # posts `didChangeNotification` only for whole-domain changes rather than for a
    # `set(_:forKey:)` write, so `UserDefaults.Observation` and `UserDefault.values` compile out —
    # this job is what keeps that boundary from drifting, and what would catch the storage half
    # regressing on a platform nobody develops on.
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test
